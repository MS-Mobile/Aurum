# PR Build — debug build + tests for master/release PRs and master pushes
# Release builds run in release-build.yml on release/** branches

name: PR Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - 'release/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Calculate week number
        id: week
        run: echo "number=$(date +%V)" >> $GITHUB_OUTPUT

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-week-${{ steps.week.outputs.number }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Build Debug and Run Tests
        run: ./gradlew assembleDebug test validateDebugScreenshotTest

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'

      - name: Upload Screenshot Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-test-results
          path: '**/build/reports/screenshotTest/**'
